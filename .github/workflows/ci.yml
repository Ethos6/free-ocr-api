name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Smoke test CLI
        run: |
          python examples/make_samples.py /tmp/samples
          freeocr extract /tmp/samples -o /tmp/out.xlsx
          freeocr extract /tmp/samples/invoice.pdf -f md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t free-ocr-api .
      - name: Run container and extract a document
        run: |
          docker run -d -p 8000:8000 --name ocr free-ocr-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -F file=@examples/samples/invoice.pdf localhost:8000/v1/extract | python -c "import sys,json; d=json.load(sys.stdin); print(d['fields']); assert d['fields']['total']==345.6"
          curl -sf -F file=@examples/samples/receipt.png localhost:8000/v1/extract | python -c "import sys,json; d=json.load(sys.stdin); print(d['fields']); assert d['fields']['total']==934.5"
